name: Deploy.Application

on:
  repository_dispatch:
    types: [artifacts-published]

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Use official SSH action (safer and cleaner than manual setup)
      - name: Setup SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # ✅ Add known hosts (avoids "host authenticity" prompt)
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ✅ Test SSH connection before proceeding
      - name: Test SSH connection
        run: |
          echo "🔍 Testing SSH connection to ${{ secrets.SERVER_HOST }}..."
          ssh -o StrictHostKeyChecking=yes ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo '✅ SSH connection successful.'"

      # ✅ Pull the new Docker image on remote server
      - name: Pull latest Docker image
        env:
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        run: |
          REF="${{ github.event.client_payload.ref }}"
          TAG="${REF#v}"
          echo "🔄 Pulling Docker image for version: $TAG"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s "$TAG" "$CONTAINER_NAME" <<'EOF'
            TAG="$1"
            CONTAINER_NAME="$2"
            echo '${{ secrets.NESTJS_RELEASE_PLEASE_TOKEN }}' | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin &&
            docker pull ghcr.io/${{ github.repository_owner }}/$CONTAINER_NAME:$TAG
          EOF

      # ✅ Deploy container (stop old, start new)
      - name: Deploy container
        env:
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          REF="${{ github.event.client_payload.ref }}"
          TAG="${REF#v}"
          echo "🚀 Deploying version: $TAG"
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s "$TAG" "$CONTAINER_NAME" "$APP_PORT" <<'EOF'
            TAG="$1"
            CONTAINER_NAME="$2"
            APP_PORT="$3"

            echo '${{ secrets.NESTJS_RELEASE_PLEASE_TOKEN }}' | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin &&
            set -e
            echo "🛑 Stopping old container (if exists)..."
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            echo "🛑 Remove old images (if exists)..."
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
              | grep "ghcr.io/anhntinterview/$CONTAINER_NAME" \
              | grep -v ":$TAG" \
              | awk '{print $2}' \
              | xargs -r docker rmi -f >/dev/null 2>&1

            echo "🌍 Exporting environment variables for Compose..."
            export IMAGE_TAG="$TAG"
            export CONTAINER_NAME="$CONTAINER_NAME"
            export APP_PORT="$APP_PORT"
            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"

            echo "🚢 Starting containers with docker-compose.prod.yml..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🚢 Starting new container..."
            # docker run -d \
            #   --name "$CONTAINER_NAME" \
            #   --restart=always \
            #   -p $APP_PORT:$APP_PORT \
            #   ghcr.io/${{ github.repository_owner }}/$CONTAINER_NAME:$TAG

            echo "🧹 Cleaning up old images..."
            docker image prune -f
          EOF

      # ✅ Verify the new container is running and healthy
      - name: Verify deployment
        env:
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        run: |
          echo "✅ Verifying deployment..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s "$CONTAINER_NAME" <<'EOF'
            CONTAINER_NAME="$1"
            docker ps --filter name="$CONTAINER_NAME" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          EOF
      - name: Setup Nginx Reverse Proxy (if needed)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.NESTJS_RELEASE_PLEASE_TOKEN }}
          repository: ${{ github.repository }}
          event-type: setup-nginx
          client-payload: |
            {
              "ref": "${{ github.event.client_payload.ref }}"
            }
